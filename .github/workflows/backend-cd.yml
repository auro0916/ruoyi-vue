name: Backend CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to deploy"
        required: true
        default: "v1.1"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::555066174866:role/GitHubActions-RuoYi-ECS-Deploy-Role
          aws-region: ap-northeast-1

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ruoyi-stg-ruoyi \
            --query taskDefinition \
            > task-definition.json

      - name: Update image in task definition
        run: |
          IMAGE_URI="555066174866.dkr.ecr.ap-northeast-1.amazonaws.com/ruoyi-stg-ruoyi:${{ inputs.image_tag }}"

          jq \
            --arg IMAGE "$IMAGE_URI" \
            '.containerDefinitions[] |=
              if .name == "ruoyi"
              then .image = $IMAGE
              else .
              end' \
            task-definition.json \
            > task-definition-updated.json