name: Backend CD

# 手动触发 CD，并输入要部署的 ECR 镜像标签
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to deploy"
        required: true
        default: "v1.1"

# 允许 GitHub Actions 获取 OIDC Token，并读取仓库内容
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    # 使用 GitHub 提供的临时 Ubuntu Runner
    runs-on: ubuntu-latest

    steps:
      # 下载当前 GitHub 仓库代码到 Runner
      - name: Checkout source code
        uses: actions/checkout@v7

      # 通过 GitHub OIDC Assume AWS IAM Role，获取临时 AWS 凭证
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::555066174866:role/GitHubActions-RuoYi-ECS-Deploy-Role
          aws-region: ap-northeast-1

      # 从 ECS 下载当前最新的 Task Definition 配置
      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ruoyi-stg-ruoyi \
            --query taskDefinition \
            > task-definition.json

      # 只把 Task Definition 中 ruoyi 容器的 image 替换成指定版本
      - name: Update image in task definition
        run: |
          IMAGE_URI="555066174866.dkr.ecr.ap-northeast-1.amazonaws.com/ruoyi-stg-ruoyi:${{ inputs.image_tag }}"

          jq \
            --arg IMAGE "$IMAGE_URI" \
            '.containerDefinitions[] |=
              if .name == "ruoyi"
              then .image = $IMAGE
              else .
              end' \
            task-definition.json \
            > task-definition-updated.json

      # 删除 AWS 查询结果中的只读字段，准备注册新的 Task Definition revision
      - name: Prepare task definition for registration
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' \
          task-definition-updated.json \
          > task-definition-register.json

      # 向 ECS 注册新的 Task Definition revision，并保存新 ARN 给下一步使用
      - name: Register new ECS task definition
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-register.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_definition_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      # 更新 ECS Service，让 Fargate 使用刚刚注册的新 Task Definition
      - name: Deploy new task definition to ECS service
        run: |
          aws ecs update-service \
            --cluster ruoyi-stg-ecs \
            --service ruoyi-stg-ruoyi-service \
            --task-definition "${{ steps.register-task-def.outputs.task_definition_arn }}"

      # 等待 ECS Service 部署完成，直到新 Task 进入稳定状态
      - name: Wait for ECS service to become stable
        run: |
          aws ecs wait services-stable \
            --cluster ruoyi-stg-ecs \
            --services ruoyi-stg-ruoyi-service